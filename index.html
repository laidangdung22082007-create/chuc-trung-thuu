<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Trung Thu - Tết Đoàn Viên</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* Canvas cho pháo hoa và sao */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Mặt trăng rực rỡ */
        .moon {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffea85, #ffd700);
            border-radius: 50%;
            position: absolute;
            top: 8%;
            box-shadow: 0 0 60px #ffd700, 0 0 120px rgba(255, 215, 0, 0.4);
            z-index: 2;
            animation: pulse 4s infinite alternate;
        }

        /* Thỏ ngọc trên mặt trăng */
        .rabbit {
            position: absolute;
            top: 13%;
            z-index: 3;
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
            animation: bounce 2s infinite ease-in-out;
        }

        /* Khung thiệp chính */
        .card {
            background: rgba(20, 20, 35, 0.65);
            backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.2);
            max-width: 90%;
            width: 420px;
            z-index: 10;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            letter-spacing: 1px;
        }

        .wish-box {
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        p#wish {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #fff8e7;
            transition: opacity 0.5s ease-in-out;
        }

        /* Nút tương tác */
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
background: linear-gradient(45deg, #ff4e50, #f9d423);
            border: none;
            color: #fff;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(249, 212, 35, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 20px rgba(249, 212, 35, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .music-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }

        /* Đèn lồng bay */
        .lantern {
            position: absolute;
            bottom: -60px;
            font-size: 28px;
            animation: floatUp linear infinite;
            z-index: 4;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-115vh) rotate(20deg); opacity: 0; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 50px #ffd700, 0 0 100px rgba(255, 215, 0, 0.3); }
            100% { box-shadow: 0 0 70px #ffd700, 0 0 140px rgba(255, 215, 0, 0.6); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="moon"></div>
    <div class="rabbit">🐇</div>

    <div class="card">
        <h1>🥮 CHÚC MỪNG TRUNG THU 🌕</h1>
        <div class="wish-box">
            <p id="wish">Đang tải lời chúc ý nghĩa nhất...</p>
        </div>
        <div class="btn-group">
            <button onclick="nextWish()">✨ Lời Chúc Khác</button>
            <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 Bật Nhạc</button>
        </div>
    </div>

    <!-- Nhạc nền hòa tấu Trung Thu -->
    <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_180…f07a.mp3?filename=asian-traditional-chinese-music-112846.mp3"></audio>

    <script>
        // Danh sách lời chúc đa dạng
        const wishes = [
            "🌕 Nhấp chén trà xanh, thưởng miếng bánh dượng. Chúc bạn và gia đình có một đêm Trung Thu ấm áp, tràn ngập tiếng cười và hạnh phúc vẹn tròn!",
            "✨ Chúc cho những ước mơ của bạn luôn tỏa sáng rực rỡ như ánh trăng rằm đêm nay. Tết Đoàn viên bình an và nhiều may mắn nhé!",
"🥮 Trung Thu đến rồi! Chúc bạn nhận được thật nhiều quà, bánh ngon và luôn giữ trọn niềm vui tươi trẻ như thời thơ bé!",
            "🏮 Chúc gia đình bạn luôn sum vầy, sức khỏe dồi dào, tình cảm đong đầy và mọi điều suôn sẻ như vòng quay trăng tròn!",
            "🐇 Gửi gắm tình cảm theo ánh trăng rằm, chúc người tôi yêu thương luôn bình an, vui vẻ và thành công trên mọi chặng đường!",
            "🎆 Chúc cho cuộc sống của bạn luôn tràn ngập màu sắc rực rỡ, ngọt ngào như hương vị của chiếc bánh Trung Thu truyền thống!",
            "🌕 Trăng tròn là lúc đoàn viên. Chúc bạn dù ở đâu cũng luôn cảm nhận được tình yêu thương ấm áp từ gia đình và người thân!",
            "✨ Đêm nay trăng sáng nhất năm, chúc cho công việc của bạn luôn hanh thông, tài lộc dồi dào và vạn sự như ý!"
        ];

        let currentWishIndex = 0;
        const wishElement = document.getElementById('wish');

        function showWish(index) {
            wishElement.style.opacity = 0;
            setTimeout(() => {
                wishElement.innerText = wishes[index];
                wishElement.style.opacity = 1;
            }, 300);
        }

        function nextWish() {
            currentWishIndex = (currentWishIndex + 1) % wishes.length;
            showWish(currentWishIndex);
            createFireworkEffect();
        }

        // Khởi tạo lời chúc đầu tiên
        showWish(0);

        // Bật/tắt nhạc
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = '🎵 Bật Nhạc';
            } else {
                music.play();
                musicBtn.innerText = '🔊 Tắt Nhạc';
            }
            isPlaying = !isPlaying;
        }

        // Tạo đèn lồng bay ngẫu nhiên
        function createLantern() {
            const lantern = document.createElement('div');
            lantern.classList.add('lantern');
            const icons = ['🏮', '🥮', '⭐'];
            lantern.innerText = icons[Math.floor(Math.random() * icons.length)];
            lantern.style.left = Math.random() * 90 + 5 + 'vw';
            lantern.style.animationDuration = (Math.random() * 5 + 7) + 's';
            document.body.appendChild(lantern);

            setTimeout(() => { lantern.remove(); }, 12000);
        }
        setInterval(createLantern, 1000);

        // Hiệu ứng pháo hoa Canvas
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.alpha = 1;
                this.friction = 0.96;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.015;
            }
        }

        function spawnFireworks(x, y) {
            const colors = ['#ffd700', '#ff4e50', '#00f2fe', '#4facfe', '#f9d423', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function createFireworkEffect() {
            const x = M
